server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Proxy vTools API requests to bypass CORS
    location /api/events-list {
        proxy_pass https://events.vtools.ieee.org/RST/events/api/public/v7/events/list;
        proxy_ssl_server_name on;
        proxy_set_header Host events.vtools.ieee.org;
    }

    location /api/vtools-events {
        proxy_pass https://events.vtools.ieee.org/RST/events/api/public/v7/events/list;
        proxy_ssl_server_name on;
        proxy_set_header Host events.vtools.ieee.org;
    }

    location /api/vtools-meetings {
        proxy_pass https://events.vtools.ieee.org/meetings/R80045/-0/365;
        proxy_ssl_server_name on;
        proxy_set_header Host events.vtools.ieee.org;
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
